<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coordinator Desk | Secure Sign-in</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>body{font:15px system-ui,-apple-system,sans-serif;background:#f5f7fa;color:#172536;margin:0;min-height:100vh;display:grid;place-items:center}.card{background:white;border:1px solid #e0e7ef;border-radius:18px;box-shadow:0 10px 25px #17253610;padding:35px;width:min(92vw,410px)}.mark{width:45px;height:45px;background:#244f77;color:white;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:26px}h1{font-size:24px;margin:20px 0 8px}p{color:#607187;line-height:1.5}.error{color:#b42318;padding:12px;background:#fff4f2;border-radius:9px}#google{min-height:45px;margin-top:20px}</style>
</head><body><div class="card"><div class="mark">C</div><h1>Convention Command Portal</h1><p>Use your approved Google account to continue to Coordinator Desk.</p><div id="status" aria-live="polite">Preparing secure sign-in…</div><div id="google"></div><p style="font-size:12px">Your identity is verified by Google and then checked against the portal's approved-user roster.</p></div>
<script>
'use strict';
/* Change ONLY these two public values, then host this file on an HTTPS origin registered in your Google OAuth Web client. */
const SETTINGS={
  CLIENT_ID:'714018109617-gev7uh405qjunm3el5503bdu82r1fgqm.apps.googleusercontent.com',
  APPS_SCRIPT_EXEC:'https://script.google.com/macros/s/AKfycbwRS_SRdCYFlHKfCYKwBW-yn7cFyYMLSy9ZucyZMuF2fz9voAIQPHY3_d1lfmZuI6mj/exec'
};
let challenge='',challengeTimer;
function status(message,error){const e=document.getElementById('status');e.textContent=message;e.className=error?'error':'';}
function fail(message){status(message,true);}
function start(){
 if(!/^\d+-[\w-]+\.apps\.googleusercontent\.com$/.test(SETTINGS.CLIENT_ID)||
   !/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(SETTINGS.APPS_SCRIPT_EXEC)){
    return fail('Login page is not configured. Ask the portal administrator to set the client ID and Apps Script URL.');
 }
 // JSONP is only used for a public one-time nonce; the response never contains private data.
 const s=document.createElement('script');s.src=SETTINGS.APPS_SCRIPT_EXEC+'?mode=challenge';s.onerror=()=>fail('Could not reach the login challenge endpoint.');document.head.append(s);
 challengeTimer=setTimeout(()=>fail('The login challenge request timed out.'),15000);
}
window.cpReceiveChallenge=function(payload){
 clearTimeout(challengeTimer);
 if(!payload||payload.ok!==true||!/^[0-9a-f-]{36}$/.test(payload.challenge||''))return fail(payload?.message||'The login challenge was invalid.');
 challenge=payload.challenge;
 let elapsed=0;
 function loadGoogle(){
  if(!window.google?.accounts?.id){if(elapsed++>60)return fail('Google sign-in did not load.');return setTimeout(loadGoogle,200);}
  status('Choose your approved Google account.');
  google.accounts.id.initialize({client_id:SETTINGS.CLIENT_ID,nonce:challenge,auto_select:false,callback:handoff});
  google.accounts.id.renderButton(document.getElementById('google'),{theme:'outline',size:'large',text:'continue_with',width:300});
 }
 loadGoogle();
};
function handoff(result){
 if(!result?.credential||!challenge)return fail('Google returned no identity token.');
 status('Validating your access…');
 const f=document.createElement('form');f.method='POST';f.action=SETTINGS.APPS_SCRIPT_EXEC;f.style.display='none';
 for(const [name,value] of Object.entries({credential:result.credential,challenge})){
  const input=document.createElement('input');input.type='hidden';input.name=name;input.value=value;f.append(input);
 }
 document.body.append(f);f.submit();
}
start();
</script></body></html>
